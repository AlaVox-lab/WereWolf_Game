# PostgreSQL cho phát triển (npm run db:up), và — trong profile "app" — cả ứng dụng đã đóng gói
# (npm run docker:up → http://localhost:8080). Hai cách dùng chung một CSDL và một volume.
name: lang-trang-mo

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Ứng dụng đóng gói (ROADMAP 6.4): web + REST + Socket.IO trên một cổng.
  app:
    profiles: ['app']
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Trong mạng Docker, CSDL tên là "postgres", cổng 5432 bên trong.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CHO_PHEP_NGUOI_CHOI_AO: ${CHO_PHEP_NGUOI_CHOI_AO}
    ports:
      - '${APP_PORT}:3000'

volumes:
  pgdata:
